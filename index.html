<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
    }

    .search-bar {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      flex-grow: 1;
    }

    .search-bar button {
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .search-bar button:hover {
      transform: scale(1.1);
    }

    .weather-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      margin-top: 20px;
      text-align: center;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .temp {
      font-size: 3rem;
      font-weight: 600;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .forecast-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    /* Hover effect */
    .forecast-item:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    /* Optional smooth icon glow on hover */
    .forecast-item:hover img {
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
    }

    .forecast-item img {
      display: block;
      margin: 10px auto;
    }

    /* Dark Mode Styles */
    body.dark-mode {
      background: linear-gradient(135deg, #121212, #2b2b2b);
      color: #e0e0e0;
    }

    .dark-mode .weather-card, 
    .dark-mode .forecast-item, 
    .dark-mode .search-bar {
      background: rgba(50, 50, 50, 0.7);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    .dark-mode .forecast-item:hover {
      background: rgba(50, 50, 50, 0.9);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .dark-mode .forecast-item img {
      filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.2));
    }

    /* Modern Toggle Switch with Icons */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slider:before {
      position: absolute;
      content: "☀️";
      font-size: 16px;
      left: 8px;
      transition: 0.4s;
    }

    input:checked + .slider {
      background-color: #595959; /* Dark ash color */
    }

    input:checked + .slider:before {
      content: "🌙";
      left: 35px;
    }
  </style>
</head>
<body>
  <!-- Modern Dark Mode Toggle Switch -->
  <div style="position: fixed; top: 20px; right: 20px;">
    <label class="switch">
      <input type="checkbox" id="dark-mode-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="search-bar">
    <input type="text" id="city-input" placeholder="Search for a city...">
    <button onclick="getWeather()"><i class="fas fa-search"></i></button>
    <button onclick="getLocationWeather()"><i class="fas fa-location-arrow"></i></button>
  </div>

  <div id="weather-result" class="weather-card d-none">
    <h2 id="city-name"></h2>
    <p id="date"></p>
    <span id="temperature" class="temp"></span>
    <p id="weather-description" class="text-capitalize"></p>
    <div class="details">
      <p><i class="fas fa-wind"></i> Wind: <span id="wind-speed"></span> km/h</p>
      <p><i class="fas fa-tint"></i> Humidity: <span id="humidity"></span>%</p>
      <p><i class="fas fa-thermometer-three-quarters"></i> Feels Like: <span id="feels-like"></span>°C</p>
    </div>
    <div class="forecast" id="forecast-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
